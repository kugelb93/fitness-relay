name: weekly-coach

on:
  schedule:
    # FALLBACK ONLY: nominally Monday 05:15 UTC, in practice GitHub has started
    # it between 10:44 and 13:52 UTC, so the "07:15" readout arrived after lunch.
    # coach.js skips this run when the dispatch below already sent the week's
    # readout (it checks the targets ledger), so the two never double-send.
    - cron: "15 5 * * 1"
  # The punctual path, fired by the breathing-bot Worker on Monday morning:
  #   POST /repos/kugelb93/fitness-relay/dispatches  {"event_type":"weekly_coach"}
  repository_dispatch:
    types: [weekly_coach]
  workflow_dispatch: {}

# One readout at a time: a dispatch and a late cron must not compose in parallel.
concurrency:
  group: weekly-coach
  cancel-in-progress: false

jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Refresh the snapshot in-place right before composing, so the coach
      # uses the freshest Hevy + Oura data available at send time instead of
      # the last committed fetch. Not committed here (the daily fetch-fitness
      # workflow owns commits; committing from two workflows would race).
      - name: Fetch fresh snapshot
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          FITNESS_KEY: ${{ secrets.FITNESS_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ENC_FORMAT: ${{ vars.ENC_FORMAT }}
        run: node fetch.js

      - name: Compose weekly readout and DM Wilhelm as the bot
        env:
          FITNESS_KEY: ${{ secrets.FITNESS_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reads and writes the targets ledger on the breathing-bot Worker, so
          # the coach can grade last week's target. Optional: without it the
          # readout simply omits the LAST WEEK line.
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node coach.js
