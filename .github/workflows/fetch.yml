name: fetch-fitness

on:
  schedule:
    # FALLBACK ONLY. These are nominally 05:00 and 08:00 UTC, but GitHub starts
    # scheduled runs when it has capacity: measured over Oct-Nov 2026 the "05:00"
    # run landed between 09:00 and 13:30 UTC and never once before the 07:30
    # brief. Cron is also UTC, so even on time it drifts an hour against
    # Stockholm at each DST change. The punctual path is the dispatch below.
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
  # Fired by the breathing-bot Worker, whose own cron triggers run on time:
  #   POST /repos/kugelb93/fitness-relay/dispatches  {"event_type":"fetch_fitness"}
  # A dispatch starts within seconds, which is what makes the snapshot fresh
  # before the brief reads it.
  repository_dispatch:
    types: [fetch_fitness]
  workflow_dispatch: {}

# Allow the job to commit fitness.json back to the repo.
permissions:
  contents: write

concurrency:
  group: fetch-fitness
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Hevy + Oura + nutrition snapshot (encrypted output)
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          FITNESS_KEY: ${{ secrets.FITNESS_KEY }}
          # Reads Apple Health nutrition back from the breathing-bot Worker.
          # Optional: unset means the snapshot carries no nutrition section.
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          # Repo VARIABLE, not a secret. Unset = v1 (CBC). Set to "v2" only after
          # the brief routine can read v2; see "Crypto" in the README.
          ENC_FORMAT: ${{ vars.ENC_FORMAT }}
        run: node fetch.js

      # main only. A branch dispatch is for verifying a code change against real
      # secrets, and committing from one produces a rival snapshot that conflicts
      # with main's on every open PR. The two files are regenerated ciphertext, so
      # there is nothing to merge when that happens.
      - name: Commit if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain fitness.json.enc history.json.enc)" ]; then
            git add fitness.json.enc history.json.enc
            git commit -m "chore: update encrypted fitness snapshot"
            git push
          else
            echo "No change in fitness.json.enc or history.json.enc"
          fi

      # Same ciphertext to the Worker, so readers can move off this public repo
      # (docs/worker-contract.md, step 5). main only, like the commit above, and
      # never fatal: git stays the source of truth until the switch.
      - name: Mirror snapshot to the Worker
        if: github.ref == 'refs/heads/main'
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node mirror.js fitness.json.enc history.json.enc
